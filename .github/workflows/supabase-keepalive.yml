name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 DB 활동이 없으면 프로젝트를 자동 일시정지합니다.
# 하루 한 번 읽기 요청을 보내 비활성 타이머를 리셋합니다. (데이터 변경 없음)
on:
  schedule:
    # 매일 UTC 15:37 (KST 00:37) - 스케줄 지연이 잦은 정시를 피함
    - cron: '37 15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          # Vercel과 이름을 맞춰 VITE_ 접두사로 등록하는 경우가 많아 둘 다 받는다.
          # (middleware.ts도 같은 방식으로 두 이름을 모두 허용한다.)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          status=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/invitations?select=id&limit=1")

          # 요청이 '실행'된 것만으로는 부족하고 DB까지 도달해야 타이머가 리셋되므로,
          # 200이 아니면 실패 처리하여 GitHub 알림 메일이 발송되도록 합니다.
          if [ "$status" != "200" ]; then
            echo "::error::Supabase 응답이 200이 아닙니다 (HTTP ${status}). DB 일시정지 또는 키 만료를 확인하세요."
            cat response.txt
            exit 1
          fi

          echo "✅ Supabase 응답 정상 (HTTP 200) - 비활성 타이머 리셋됨"
