<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wedding-blueprint</title>
    
    <!-- Default Open Graph Tags (미리보기 용) -->
    <meta property="og:title" content="저희 결혼합니다" />
    <meta property="og:description" content="모바일 청첩장 - 소중한 분들을 초대합니다" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:type" content="website" />
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!--
      구글 폰트는 청첩장이 선택한 1종만 런타임에 주입한다. → src/hooks/useThemeFont.ts
      9종을 정적으로 불러오면 렌더가 차단되는데, 실제로 쓰이는 것은 1종뿐이다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      카카오 SDK(지도 / 공유)는 첫 화면에 필요하지 않으므로 여기서 불러오지 않는다.
      렌더를 막지 않도록 실제 사용 시점에 주입한다. → src/services/kakaoSdk.ts
      integrity 값도 해당 파일에서 관리한다.
    -->
    <link rel="preconnect" href="https://dapi.kakao.com" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
